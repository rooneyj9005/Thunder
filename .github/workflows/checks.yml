name: Checks

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# packwiz publishes no release tags, so it is pinned to a commit. The published
# index.toml and the release .mrpack both come out of whatever this builds, so
# it moves on deliberately rather than with the upstream branch.
env:
  PACKWIZ_COMMIT: ef87d964f8cbd52b3b13ea42453ef322290e2b9e

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Lint Bash scripts
        shell: bash
        run: bash ./.github/scripts/checks-shell.sh

      # Windows PowerShell 5.1 is what these scripts declare and what runs them,
      # so on Windows it is also what parses them. Linux only has PowerShell 7,
      # where the analyzer's 5.1 compatibility rules stand in for the parser.
      - name: Validate PowerShell (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.github/scripts/checks-powershell.ps1

      - name: Validate PowerShell (PowerShell 7)
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./.github/scripts/checks-powershell.ps1

  validate:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packwiz
        shell: bash
        run: go install "github.com/packwiz/packwiz@${PACKWIZ_COMMIT}"

      - name: Prepare local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/build-pages.sh "$RUNNER_TEMP/pack-pages"

      - name: Start local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pack-pages" > "$RUNNER_TEMP/pack-http-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pack-http-server.pid"

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/pack.toml >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: Local pack metadata host did not start." >&2
          cat "$RUNNER_TEMP/pack-http-server.log" >&2 || true
          exit 1

      - name: Fetch packwiz-installer
        shell: bash
        run: |
          set -euo pipefail
          # packwiz-installer-bootstrap otherwise asks the GitHub releases API for
          # the newest installer on every run. Runners share addresses, so that
          # request routinely lands on an exhausted sixty-an-hour budget and comes
          # back 403, which surfaces as a broken pack rather than a busy API. A
          # release asset URL is not the API and is not rate limited the same way,
          # so CI fetches one version by URL, checks its hash, and runs that.
          # Players keep the auto-update; only CI passes --bootstrap-no-update.
          curl -sSfL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
            -o "$RUNNER_TEMP/packwiz-installer.jar" \
            "https://github.com/packwiz/packwiz-installer/releases/download/v0.5.14/packwiz-installer.jar"
          echo "c9f646908d340d84773948a9a7d98bc1dae250d35e1016dc6e2b8459760b5598  $RUNNER_TEMP/packwiz-installer.jar" | sha256sum -c -

      - name: Validate pack build and update path
        env:
          TEST_PACK_URL: http://127.0.0.1:8123/pack.toml
          PACKWIZ_EXTRA_FLAGS: --bootstrap-no-update --bootstrap-main-jar ${{ runner.temp }}/packwiz-installer.jar
        shell: bash
        run: bash ./.github/scripts/checks-pack.sh

      - name: Stop local pack metadata host
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pack-http-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pack-http-server.pid")" || true
          fi
