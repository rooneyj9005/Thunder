name: Build

on:
  push:
    tags:
      - "**"

permissions:
  actions: read
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  await-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for Checks on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            runs_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/checks.yml/runs?head_sha=${TAG_SHA}&event=push&branch=development&per_page=20"
            )"

            run_count="$(jq '.workflow_runs | length' <<<"$runs_json")"
            if [[ "$run_count" -gt 0 ]]; then
              latest_run="$(jq '.workflow_runs | sort_by(.run_number) | last' <<<"$runs_json")"
              run_id="$(jq -r '.id' <<<"$latest_run")"
              run_url="$(jq -r '.html_url' <<<"$latest_run")"
              status="$(jq -r '.status' <<<"$latest_run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$latest_run")"

              echo "Checks run ${run_id} is ${status}${conclusion:+ with conclusion ${conclusion}}."

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi

                echo "ERROR: Checks for tagged commit ${TAG_SHA} on development completed with conclusion '${conclusion}'. See ${run_url}" >&2
                exit 1
              fi
            else
              echo "No Checks run found yet for commit ${TAG_SHA} on development."
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "ERROR: Timed out waiting for Checks on development for commit ${TAG_SHA}." >&2
              exit 1
            fi

            sleep 10
          done

  prerelease:
    needs: await-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install latest packwiz
        shell: bash
        run: go install github.com/packwiz/packwiz@latest

      - name: Lint Bash scripts
        shell: bash
        run: bash ./.github/scripts/lint-shell.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./.github/scripts/lint-powershell.ps1

      - name: Prepare local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/prepare-pack-pages-artifact.sh "$RUNNER_TEMP/pack-pages"

      - name: Start local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pack-pages" > "$RUNNER_TEMP/pack-http-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pack-http-server.pid"

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/pack.toml >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: Local pack metadata host did not start." >&2
          cat "$RUNNER_TEMP/pack-http-server.log" >&2 || true
          exit 1

      - name: Validate pack build and update path
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
          SMOKE_PACK_URL: http://127.0.0.1:8123/pack.toml
        shell: bash
        run: bash ./.github/scripts/validate-pack.sh

      - name: Build packwiz helper binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci/bin
          cp "$(go env GOPATH)/bin/packwiz" _ci/bin/packwiz
          GOOS=windows GOARCH=amd64 go install github.com/packwiz/packwiz@latest
          cp "$(go env GOPATH)/bin/windows_amd64/packwiz.exe" _ci/bin/packwiz.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            _ci/bin/packwiz
            _ci/bin/packwiz.exe

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_json=""
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>/dev/null)"; then
            if [[ "$(jq -r '.prerelease // false' <<<"$release_json")" != "true" ]]; then
              echo "ERROR: Release $TAG_NAME already exists as a stable release." >&2
              exit 1
            fi

            gh release upload "$TAG_NAME" _ci/Thunder.mrpack install.sh install.ps1 pterodactyl.json --clobber
            release_id="$(jq -r '.id' <<<"$release_json")"
          else
            gh release create "$TAG_NAME" \
              _ci/Thunder.mrpack install.sh install.ps1 pterodactyl.json \
              --verify-tag \
              --generate-notes \
              --latest=false \
              --prerelease \
              --title "$TAG_NAME"

            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.id')"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --method PATCH \
            -f prerelease=true \
            -f make_latest=false >/dev/null

      - name: Stop local pack metadata host
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pack-http-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pack-http-server.pid")" || true
          fi
