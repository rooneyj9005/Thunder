name: Build and Release Modpack
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.3.0
        with:
          cache: false
          go-version: "stable"
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
      - name: Compile packwiz.exe for Windows
        run: |
          GOOS=windows GOARCH=amd64 go install github.com/packwiz/packwiz@latest
          cp "$(go env GOPATH)/bin/windows_amd64/packwiz.exe" .
          test -f packwiz.exe
      - name: Normalize shell scripts to LF
        run: |
          sed -i 's/\r$//' install.sh startup.sh update.sh
          if grep -q $'\r' install.sh startup.sh update.sh; then
            echo "ERROR: CRLF line endings still present in shell scripts." >&2
            exit 1
          fi
      - name: Refresh Modpack
        run: $(go env GOPATH)/bin/packwiz refresh
      - name: Export Modpack
        run: |
          $(go env GOPATH)/bin/packwiz modrinth export
          EXPORTED_PACK=$(ls -1 *.mrpack | head -n 1)
          if [ -z "$EXPORTED_PACK" ]; then
            echo "ERROR: No .mrpack file was produced." >&2
            exit 1
          fi
          mv -f "$EXPORTED_PACK" Thunder.mrpack
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} --clobber Thunder.mrpack install.sh install.ps1
      - name: Stage Pages content
        run: |
            mkdir -p public
            rsync -av --include='.*' --exclude-from='.pagesignore' . public/
            if [ -f CNAME ]; then cp CNAME public/; fi
            if [ -f .nojekyll ]; then cp .nojekyll public/; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5