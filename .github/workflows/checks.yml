name: Checks

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Lint Bash scripts
        shell: bash
        run: bash ./.github/scripts/checks-shell.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./.github/scripts/checks-powershell.ps1

  validate:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install latest packwiz
        shell: bash
        run: go install github.com/packwiz/packwiz@latest

      - name: Prepare local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/build-pages.sh "$RUNNER_TEMP/pack-pages"

      - name: Start local pack metadata host
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pack-pages" > "$RUNNER_TEMP/pack-http-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pack-http-server.pid"

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/pack.toml >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: Local pack metadata host did not start." >&2
          cat "$RUNNER_TEMP/pack-http-server.log" >&2 || true
          exit 1

      - name: Fetch packwiz-installer
        shell: bash
        run: |
          set -euo pipefail
          # packwiz-installer-bootstrap otherwise asks the GitHub releases API for
          # the newest installer on every run. Runners share addresses, so that
          # request routinely lands on an exhausted sixty-an-hour budget and comes
          # back 403, which surfaces as a broken pack rather than a busy API. The
          # plain release asset URL below is not the API and is not rate limited
          # the same way, so CI pins what it runs and stops guessing. Players keep
          # the auto-update; only CI passes --bootstrap-no-update.
          curl -sSfL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
            -o "$RUNNER_TEMP/packwiz-installer.jar" \
            "https://github.com/packwiz/packwiz-installer/releases/latest/download/packwiz-installer.jar"

      - name: Validate pack build and update path
        env:
          TEST_PACK_URL: http://127.0.0.1:8123/pack.toml
          PACKWIZ_EXTRA_FLAGS: --bootstrap-no-update --bootstrap-main-jar ${{ runner.temp }}/packwiz-installer.jar
        shell: bash
        run: bash ./.github/scripts/checks-pack.sh

      - name: Stop local pack metadata host
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pack-http-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pack-http-server.pid")" || true
          fi
