name: Build Release Assets
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          cache: false
          go-version: "stable"
      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          PACKWIZ_VERSION="$(go list -m -f '{{.Version}}' github.com/packwiz/packwiz@latest 2>/dev/null || true)"
          if [ -n "$PACKWIZ_VERSION" ]; then
            echo "packwiz version: $PACKWIZ_VERSION"
          fi
      - name: Compile packwiz.exe for Windows
        run: |
          GOOS=windows GOARCH=amd64 go install github.com/packwiz/packwiz@latest
          cp "$(go env GOPATH)/bin/windows_amd64/packwiz.exe" .
          test -f packwiz.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packwiz.exe
      - name: Normalize shell scripts to LF
        run: |
          sed -i 's/\r$//' install.sh startup.sh update.sh
          if grep -q $'\r' install.sh startup.sh update.sh; then
            echo "ERROR: CRLF line endings still present in shell scripts." >&2
            exit 1
          fi
      - name: Refresh Modpack
        run: $(go env GOPATH)/bin/packwiz refresh
      - name: Export Modpack
        run: |
          $(go env GOPATH)/bin/packwiz modrinth export
          EXPORTED_PACK=$(ls -1 *.mrpack | head -n 1)
          if [ -z "$EXPORTED_PACK" ]; then
            echo "ERROR: No .mrpack file was produced." >&2
            exit 1
          fi
          mv -f "$EXPORTED_PACK" Thunder.mrpack
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} --clobber Thunder.mrpack install.sh install.ps1 pterodactyl.json
